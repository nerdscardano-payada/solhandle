[package]
name = "solhandle"
version = "0.1.0"
description = "Non-custodial SolHandle registry and Metaplex Core minting program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solhandle"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor", "anchor-0-32"] }